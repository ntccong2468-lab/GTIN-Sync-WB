name: Build Marketplace Hub Windows
on:
  push:
    branches: [ "marketplace-hub-v2" ]
    paths:
      - "MarketplaceHub/**"
      - ".github/workflows/build-marketplace-hub.yml"
      - "!MarketplaceHub/dist/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore .\MarketplaceHub\MarketplaceHub.csproj
      - name: Build
        run: dotnet build .\MarketplaceHub\MarketplaceHub.csproj -c Release --no-restore
      - name: Publish self-contained
        run: dotnet publish .\MarketplaceHub\MarketplaceHub.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:PublishTrimmed=false
      - name: Smoke launch
        shell: powershell
        run: |
          $exe = Resolve-Path ".\MarketplaceHub\bin\Release\net8.0-windows\win-x64\publish\MarketplaceHub.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "MarketplaceHub exited during smoke launch." }
          Stop-Process -Id $p.Id -Force
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ".\MarketplaceHub\installer\MarketplaceHub.iss"
          Get-FileHash ".\MarketplaceHub\dist\MarketplaceHub-Setup-0.1.0-win-x64.exe" -Algorithm SHA256
      - name: Silent install test
        shell: powershell
        run: |
          $setup = Resolve-Path ".\MarketplaceHub\dist\MarketplaceHub-Setup-0.1.0-win-x64.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\MarketplaceHub\MarketplaceHub.exe"
          if (!(Test-Path $installed)) { throw "Installed exe not found" }
          $app = Start-Process $installed -PassThru
          Start-Sleep -Seconds 4
          if ($app.HasExited) { throw "Installed app exited unexpectedly" }
          Stop-Process -Id $app.Id -Force
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketplaceHub-Setup-0.1.0-win-x64
          path: MarketplaceHub/dist/MarketplaceHub-Setup-0.1.0-win-x64.exe
          if-no-files-found: error
      - name: Commit verified installer to branch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f MarketplaceHub/dist/MarketplaceHub-Setup-0.1.0-win-x64.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add verified Marketplace Hub Windows installer"
            git push origin HEAD:marketplace-hub-v2
          }
