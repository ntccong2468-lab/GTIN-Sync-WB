name: Marketplace Hub regression tests
on:
  push:
    branches: ["fix/dashboard-fbs-stability", "marketplace-hub-v2", "feat/fbs-kiz-label-jobs"]
    paths: ["MarketplaceHub/**", "tests/MarketplaceHub.*/**", ".github/workflows/marketplace-regression.yml", "!MarketplaceHub/dist/**"]
  pull_request:
    branches: ["marketplace-hub-v2"]
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !MarketplaceHub/dist/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Durable FBS KIZ workflows
        if: always()
        run: dotnet run --project tests/MarketplaceHub.Workflows -c Release
      - name: API contracts
        run: dotnet run --project tests/MarketplaceHub.Contracts -c Release
      - name: Ozon and Yandex FBS contracts
        run: dotnet run --project tests/MarketplaceHub.Fbs -c Release
      - name: Product and GTIN synchronization contracts
        run: dotnet run --project tests/MarketplaceHub.ProductSync -c Release
      - name: Persistent FBS recovery
        run: dotnet run --project tests/MarketplaceHub.FbsState -c Release
      - name: License add-store gates
        run: dotnet run --project tests/MarketplaceHub.License -c Release
      - name: Stateful Ozon and Yandex mock API
        if: always()
        run: dotnet run --project tests/MarketplaceHub.MockApi -c Release
      - name: UI navigation and layout
        if: always()
        env:
          MARKETPLACE_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: dotnet run --project tests/MarketplaceHub.UI -c Release
      - name: Label and picking PDF regressions
        if: always()
        env:
          MARKETPLACE_PRINT_SAMPLES: ${{ github.workspace }}/print-samples
        run: dotnet run --project tests/MarketplaceHub.Print -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarketplaceHub-UI-screenshots
          path: screenshots/*.png
